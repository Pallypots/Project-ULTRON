name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Runs the real local Whisper speech-recognition test (downloads the model once, then cached).
      ULTRON_TEST_WHISPER: "1"
      ULTRON_TEST_TTS: "1"
      ULTRON_TEST_EMBED: "1"
      ULTRON_TEST_GITHUB: "1"
      ULTRON_TEST_WEB: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ULTRON_TEST_MODEL_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: local-models-v2-${{ runner.os }}
      - name: Install Ollama (Linux) for the real local-brain test
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service where available; otherwise run the server ourselves.
          curl -sf http://127.0.0.1:11434/api/version || (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/version || { echo "Ollama did not start"; cat "$RUNNER_TEMP/ollama.log" || true; exit 1; }
          echo "ULTRON_TEST_OLLAMA=1" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Report real-world results recorded by the tests
        if: always()
        run: node scripts/ci-notes.mjs
      - run: npm run build
      - run: npm run doctor
      - name: Windows launcher smoke test (Start-ULTRON.bat --background)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ULTRON_PORT = "7480"
          $env:ULTRON_DATA_DIR = "$env:RUNNER_TEMP\ultron-launcher"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "Start-ULTRON.bat", "--background" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\launcher.out" -RedirectStandardError "$env:RUNNER_TEMP\launcher.err"
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest "http://localhost:7480/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $html = if ($ok) { (Invoke-WebRequest "http://localhost:7480/" -UseBasicParsing).Content } else { "" }
          if (-not $ok) { Write-Output "--- launcher output ---"; Get-Content "$env:RUNNER_TEMP\launcher.out", "$env:RUNNER_TEMP\launcher.err" -Tail 60 -ErrorAction SilentlyContinue; Write-Output "--- service log ---"; Get-Content "$env:ULTRON_DATA_DIR\logs\service.log" -Tail 40 -ErrorAction SilentlyContinue; Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output "::error title=Windows launcher::Start-ULTRON.bat did not bring ULTRON online within 300 s"; exit 1 }
          if ($html -notmatch "<title>ULTRON</title>") { Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output "::error title=Windows launcher::ULTRON started but the interface wasn't served"; exit 1 }
          $startedAfter = $i
          $gwPid = { @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -like '*gateway/src/main.ts*' })[0].ProcessId }
          $pid1 = & $gwPid
          # Negative control: launching again with nothing changed must reuse the running ULTRON (same process).
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "Start-ULTRON.bat", "--background" -Wait -WindowStyle Hidden
          $pid2 = & $gwPid
          if ($pid1 -ne $pid2) { Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output "::error title=Windows launcher::Relaunching with no changes restarted ULTRON ($pid1 -> $pid2)"; exit 1 }
          # Positive control: after the code changes (as when a new download is unpacked), launching must restart it.
          (Get-Item "services/gateway/src/main.ts").LastWriteTime = Get-Date
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "Start-ULTRON.bat", "--background" -Wait -WindowStyle Hidden
          for ($k = 0; $k -lt 60; $k++) { Start-Sleep -Seconds 1; try { if ((Invoke-WebRequest "http://localhost:7480/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { break } } catch {} }
          $pid3 = & $gwPid
          if (-not $pid3 -or $pid3 -eq $pid2) { Get-Content "$env:ULTRON_DATA_DIR\logs\service.log" -Tail 30 -ErrorAction SilentlyContinue; Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output "::error title=Windows launcher::Updated code did not replace the running ULTRON ($pid2 -> $pid3)"; exit 1 }
          # Crash recovery: kill the service itself; the supervisor must bring it back.
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -like '*gateway/src/main.ts*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Start-Sleep -Seconds 2
          $back = $false
          for ($j = 0; $j -lt 90; $j++) {
            Start-Sleep -Seconds 1
            try { if ((Invoke-WebRequest "http://localhost:7480/api/health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200) { $back = $true; break } } catch {}
          }
          if (-not $back) { Get-Content "$env:ULTRON_DATA_DIR\logs\service.log" -Tail 40 -ErrorAction SilentlyContinue; Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Output "::error title=Windows launcher::ULTRON was not restarted after its service was killed"; exit 1 }
          # Quit (from the PC) stops everything, including the supervisor.
          $boot = Invoke-RestMethod "http://localhost:7480/api/bootstrap"
          Invoke-RestMethod -Method Post "http://localhost:7480/api/system/quit" -Headers @{ Authorization = "Bearer $($boot.token)" } -ContentType "application/json" -Body "{}" | Out-Null
          Start-Sleep -Seconds 4
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -like '*supervise.mjs*' -or $_.CommandLine -like '*gateway/src/main.ts*' })
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($left.Count) { Write-Output "::error title=Windows launcher::Quit left $($left.Count) ULTRON process(es) running"; exit 1 }
          Write-Output "::notice title=Windows launcher::Start-ULTRON.bat --background brought ULTRON online after $startedAfter s, served the interface, came back by itself after its service was killed ($j s), relaunch kept it when nothing changed and replaced it after a code change, and Quit stopped it"
      - name: Browser end-to-end test (fake microphone)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: docs/screenshots/
