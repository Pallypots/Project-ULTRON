name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Runs the real local Whisper speech-recognition test (downloads the model once, then cached).
      ULTRON_TEST_WHISPER: "1"
      ULTRON_TEST_TTS: "1"
      ULTRON_TEST_GITHUB: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ULTRON_TEST_MODEL_DIR: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .model-cache
          key: local-models-v2-${{ runner.os }}
      - name: Install Ollama (Linux) for the real local-brain test
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer starts a systemd service where available; otherwise run the server ourselves.
          curl -sf http://127.0.0.1:11434/api/version || (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/version || { echo "Ollama did not start"; cat "$RUNNER_TEMP/ollama.log" || true; exit 1; }
          echo "ULTRON_TEST_OLLAMA=1" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run doctor
      - name: Browser end-to-end test (fake microphone)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: docs/screenshots/
